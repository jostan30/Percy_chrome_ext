name: Build and Release Percy Local Manager

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build distributables
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Go
      # ------------------------------------------------------

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # ------------------------------------------------------
      # Setup Node
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ------------------------------------------------------
      # Make build script executable
      # ------------------------------------------------------

      - name: Make build script executable
        run: chmod +x build-distributables.sh

      # ------------------------------------------------------
      # Build everything
      # ------------------------------------------------------

      - name: Build distributables
        run: ./build-distributables.sh

      # ------------------------------------------------------
      # Verify output
      # ------------------------------------------------------

      - name: Verify distributables
        run: |
          echo "=========================================="
          echo "Checking distributables"
          echo "=========================================="

          find Distributables -maxdepth 3 -type f | sort

          echo
          echo "Checking Linux..."

          test -f Distributables/percy-linux/server
          test -f Distributables/percy-linux/server.sh
          test -f Distributables/percy-linux/Instruction.md

          echo
          echo "Checking Mac..."

          test -f Distributables/percy-mac/server
          test -f Distributables/percy-mac/server-arm64
          test -f Distributables/percy-mac/server.sh
          test -f Distributables/percy-mac/Instructions.md

          echo
          echo "Checking Windows..."

          test -f Distributables/percy-windows/server.exe
          test -f Distributables/percy-windows/server.bat
          test -f Distributables/percy-windows/Instructions.md

          echo
          echo "Checking Extension..."

          test -d Distributables/percy-local-manager-extension

          echo
          echo "✅ All distributables verified"

      # ------------------------------------------------------
      # Prepare release folders
      # ------------------------------------------------------

      - name: Prepare release packages
        run: |

          mkdir -p release/percy-linux
          mkdir -p release/percy-mac
          mkdir -p release/percy-windows

          # --------------------------------------------------
          # Linux
          # --------------------------------------------------

          cp -R Distributables/percy-linux/. \
            release/percy-linux/

          cp -R Distributables/percy-local-manager-extension \
            release/percy-linux/

          # --------------------------------------------------
          # Mac
          # --------------------------------------------------

          cp -R Distributables/percy-mac/. \
            release/percy-mac/

          cp -R Distributables/percy-local-manager-extension \
            release/percy-mac/

          # --------------------------------------------------
          # Windows
          # --------------------------------------------------

          cp -R Distributables/percy-windows/. \
            release/percy-windows/

          cp -R Distributables/percy-local-manager-extension \
            release/percy-windows/

          echo "=========================================="
          echo "Release package contents"
          echo "=========================================="

          echo
          echo "Linux:"
          find release/percy-linux -maxdepth 3 -type f | sort

          echo
          echo "Mac:"
          find release/percy-mac -maxdepth 3 -type f | sort

          echo
          echo "Windows:"
          find release/percy-windows -maxdepth 3 -type f | sort

      # ------------------------------------------------------
      # ZIP Linux
      # ------------------------------------------------------

      - name: Package Linux
        run: |
          cd release
          zip -r ../percy-linux.zip percy-linux

      # ------------------------------------------------------
      # ZIP Mac
      # ------------------------------------------------------

      - name: Package Mac
        run: |
          cd release
          zip -r ../percy-mac.zip percy-mac

      # ------------------------------------------------------
      # ZIP Windows
      # ------------------------------------------------------

      - name: Package Windows
        run: |
          cd release
          zip -r ../percy-windows.zip percy-windows

      # ------------------------------------------------------
      # Show ZIPs
      # ------------------------------------------------------

      - name: Show release files
        run: |
          echo "=========================================="
          echo "Release ZIPs"
          echo "=========================================="

          ls -lh \
            percy-linux.zip \
            percy-mac.zip \
            percy-windows.zip

      # ------------------------------------------------------
      # Create Linux Release
      # ------------------------------------------------------

      - name: Create Linux Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "percy-linux-${{ github.ref_name }}" \
            percy-linux.zip \
            --title "Percy Linux ${{ github.ref_name }}" \
            --notes "Percy Local Manager for Linux."

      # ------------------------------------------------------
      # Create Mac Release
      # ------------------------------------------------------

      - name: Create Mac Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "percy-mac-${{ github.ref_name }}" \
            percy-mac.zip \
            --title "Percy Mac ${{ github.ref_name }}" \
            --notes "Percy Local Manager for macOS."

      # ------------------------------------------------------
      # Create Windows Release
      # ------------------------------------------------------

      - name: Create Windows Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "percy-windows-${{ github.ref_name }}" \
            percy-windows.zip \
            --title "Percy Windows ${{ github.ref_name }}" \
            --notes "Percy Local Manager for Windows."